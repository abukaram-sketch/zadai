
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zad AI - Premium Virtual Stylist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', 'Noto Sans Arabic', sans-serif;
            background-color: #ffffff;
            overscroll-behavior-y: none;
            -webkit-font-smoothing: antialiased;
        }
        .serif {
            font-family: 'Bodoni Moda', serif;
        }
        [dir="rtl"] .serif {
            font-family: 'Noto Sans Arabic', sans-serif;
            font-weight: 700;
        }
        /* Custom scrollbar for desktop but hidden on mobile */
        @media (min-width: 768px) {
            ::-webkit-scrollbar { width: 6px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: #f1f1f1; border-radius: 10px; }
        }
    </style>
<script type="importmap">

}

</head>
